<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book My Show - Movie Booking</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <div class="navbar-brand">
                <h1><a href="index.html" style="text-decoration: none; color: inherit;">🎬 Book My Show</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="movies.html">Movies</a></li>
                <li id="navProfile" style="display: none;"><a href="profile.html">Profile</a></li>
                <li id="navAdmin" style="display: none;"><a href="admin.html">Admin</a></li>
                <li id="navLogout" style="display: none;"><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section id="authSection" class="page-section">
            <div class="auth-container">
                <div class="form-tabs">
                    <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form" style="display: block;">
                    <h2>Login to your Account</h2>
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password:</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p id="loginError" class="error-message"></p>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form" style="display: none;">
                    <h2>Create New Account</h2>
                    <div class="form-group">
                        <label for="registerName">Full Name:</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password:</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPhone">Phone:</label>
                        <input type="tel" id="registerPhone" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                    <p id="registerError" class="error-message"></p>
                </form>
            </div>
        </section>

        <section id="welcomeSection" style="display: none;" class="page-section">
            <div class="welcome-box">
                <h2>Welcome to Book My Show!</h2>
                <p>Your favorite movie booking platform</p>
                <a href="movies.html" class="btn btn-primary">Browse Movies</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Book My Show. All rights reserved.</p>
    </footer>

    <script src="assets/api.js"></script>
    <script src="assets/auth.js"></script>
    <script>
        // Check if user is already logged in
        window.addEventListener('load', () => {
            if (api.isAuthenticated()) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('welcomeSection').style.display = 'block';
                updateNavbar();
            }
        });

        function switchTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
    </script>
</body>

</html>
